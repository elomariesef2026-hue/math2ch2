est un problème pour apprendre : elle fait construire une notion nouvelle par la recherche.","dur":30},{"id":"4","theme":"Le problème mathématique","enonce":"Que reproche-t-on à un apprentissage fondé sur des procédures présentées hors contexte ?","choix":["Il demande trop de matériel pour être mis en place en classe","Il est trop court pour permettre une évaluation fiable","Il conduit à une application mécanique sans construction de sens","Il empêche l'élève de mémoriser les techniques de calcul"],"bonne":2,"explication":"Sans contexte, l'élève applique mécaniquement sans donner de sens aux notions.","dur":30},{"id":"5","theme":"Typologie des problèmes","enonce":"Dans la typologie des problèmes scolaires, quelle est la fonction d'un problème pour apprendre ?","choix":["Consolider une notion déjà enseignée en contexte proche","Vérifier le transfert d'une notion en contexte différent","Faire construire une notion nouvelle par la recherche","Développer des compétences de recherche sans contenu précis"],"bonne":2,"explication":"Le problème pour apprendre (situation-problème) fait construire une notion nouvelle.","dur":30},{"id":"6","theme":"Typologie des problèmes","enonce":"Quelle est la fonction pédagogique d'un problème d'application ou de réinvestissement ?","choix":["Faire découvrir une notion nouvelle par la recherche de l'élève","Développer la communication sans lien avec un contenu notionnel","Évaluer la capacité de lecture de l'énoncé par l'élève","Consolider et automatiser une notion déjà enseignée en contexte proche"],"bonne":3,"explication":"Ce type de problème consolide et automatise une notion déjà enseignée, dans un contexte proche.","dur":30},{"id":"7","theme":"Typologie des problèmes","enonce":"Quel type de problème scolaire vérifie que l'élève mobilise une notion dans un contexte différent de celui de son apprentissage initial ?","choix":["Le problème pour apprendre en situation-problème","Le problème de transfert en contexte varié","Le problème d'application en contexte proche","Le problème ouvert ou de recherche libre"],"bonne":1,"explication":"Le transfert vérifie que l'élève reconnaît et mobilise la notion dans un contexte différent.","dur":45},{"id":"8","theme":"Typologie des problèmes","enonce":"Quelles compétences un problème ouvert ou de recherche permet-il surtout de développer ?","choix":["Des techniques opératoires précises sur les nombres entiers","La mémorisation rapide des tables de multiplication usuelles","Des connaissances géométriques liées aux figures planes simples","Des compétences transversales de recherche, d'organisation et de communication"],"bonne":3,"explication":"Le problème ouvert développe des compétences transversales, indépendamment d'un contenu notionnel précis.","dur":30},{"id":"9","theme":"Typologie des problèmes","enonce":"Un enseignant propose un problème pour introduire la division avant toute leçon sur cette notion. De quel type de problème scolaire s'agit-il ?","choix":["Un problème d'application ou de réinvestissement","Un problème pour apprendre (situation-problème)","Un problème de transfert en contexte varié","Un problème ouvert ou de recherche libre"],"bonne":1,"explication":"Un problème proposé avant la leçon pour faire construire la notion est une situation-problème.","dur":45},{"id":"10","theme":"Méthode de Polya","enonce":"Dans la méthode de résolution de problèmes de Polya, quelle est la première étape ?","choix":["Concevoir un plan de résolution","Comprendre le problème posé","Exécuter le plan de résolution","Vérifier le résultat obtenu"],"bonne":1,"explication":"Les quatre étapes sont, dans l'ordre : comprendre, concevoir un plan, exécuter, vérifier.","dur":30},{"id":"11","theme":"Méthode de Polya","enonce":"Dans la méthode de Polya, quelle étape vient juste après la conception d'un plan de résolution ?","choix":["Comprendre le problème en le reformulant","Vérifier la plausibilité du résultat obtenu","Exécuter le plan en menant les calculs","Choisir une représentation de la situation"],"bonne":2,"explication":"Après avoir conçu le plan, on l'exécute (calculs, construction), puis on vérifie.","dur":30},{"id":"12","theme":"Méthode de Polya","enonce":"Dans la méthode de Polya, quelle est la dernière étape de la résolution d'un problème ?","choix":["Comprendre le problème posé à l'élève","Vérifier et interpréter le résultat obtenu","Concevoir un plan de résolution adapté","Exécuter les calculs ou la construction"],"bonne":1,"explication":"La démarche se termine par la vérification et l'interprétation du résultat.","dur":30},{"id":"13","theme":"Méthode de Polya","enonce":"À l'étape « comprendre le problème » de la méthode de Polya, que doit faire l'élève ?","choix":["Identifier la question, les données et reformuler l'énoncé","Mener les calculs et les constructions utiles","Choisir une opération et une représentation","Contrôler la plausibilité du résultat final"],"bonne":0,"explication":"Comprendre, c'est identifier la question posée et les données, et reformuler avec ses mots.","dur":30},{"id":"14","theme":"Méthode de Polya","enonce":"À l'étape « concevoir un plan » de la méthode de Polya, que doit faire l'élève ?","choix":["Reformuler l'énoncé avec ses propres mots","Mener les calculs ou la construction prévue","Vérifier que le résultat répond à la question","Choisir une stratégie, une opération et une représentation"],"bonne":3,"explication":"Concevoir un plan, c'est choisir une stratégie, une opération, une représentation.","dur":30},{"id":"15","theme":"Méthode de Polya","enonce":"À l'étape « exécuter le plan » de la méthode de Polya, que fait l'élève ?","choix":["Il mène les calculs ou la construction prévue","Il identifie la question posée et les données","Il choisit la stratégie et l'opération adaptée","Il juge si le résultat est plausible"],"bonne":0,"explication":"Exécuter le plan, c'est mener les calculs ou la construction.","dur":30},{"id":"16","theme":"Méthode de Polya","enonce":"À l'étape « vérifier et interpréter » de la méthode de Polya, que doit se demander l'élève ?","choix":["Quelle opération permet de résoudre le problème","Quelles données sont présentes dans l'énoncé","Si le résultat est plausible et répond à la question","Comment reformuler l'énoncé avec ses propres mots"],"bonne":2,"explication":"La vérification porte sur la plausibilité du résultat et son adéquation à la question.","dur":30},{"id":"17","theme":"Méthode de Polya","enonce":"Comment la méthode de Polya doit-elle être traitée dans l'enseignement primaire ?","choix":["Elle doit être découverte spontanément par tous les élèves","Elle doit être réservée aux seuls élèves en difficulté","Elle doit être utilisée uniquement en géométrie plane","Elle doit être explicitement enseignée avec des outils adaptés"],"bonne":3,"explication":"Au primaire, la méthodologie doit être explicitement enseignée et outillée.","dur":30},{"id":"18","theme":"Méthode de Polya","enonce":"Quel outil aide l'élève du primaire à représenter une situation lors de la résolution d'un problème ?","choix":["La mémorisation du corrigé de l'enseignant","Le dessin ou le schéma de la situation","La recopie de l'énoncé sans aucune modification","Le calcul immédiat sans aucune représentation"],"bonne":1,"explication":"Le dessin ou le schéma fait partie des outils pour représenter la situation.","dur":30},{"id":"19","theme":"Méthode de Polya","enonce":"Un enseignant demande à l'élève : « Est-ce que 150 ans pour l'âge d'une personne, c'est raisonnable ? » À quelle étape de la méthode de Polya correspond ce questionnement ?","choix":["Comprendre le problème posé","Concevoir un plan de résolution","Vérifier et interpréter le résultat obtenu","Exécuter le plan de résolution"],"bonne":2,"explication":"C'est un retour critique sur la cohérence du résultat, donc l'étape de vérification.","dur":45},{"id":"20","theme":"Méthode de Polya","enonce":"Problème : « Un fermier a 17 poules et 6 lapins. Combien d'animaux a-t-il en tout ? » Quelle opération faut-il choisir ?","choix":["Une soustraction : 17 − 6","Une multiplication : 17 × 6","Une addition : 17 + 6","Une division : 17 ÷ 6"],"bonne":2,"explication":"On cherche un total à partir de deux quantités : c'est une addition.","dur":45},{"id":"21","theme":"Méthode de Polya","enonce":"Pourquoi le résultat 23 est-il cohérent pour le problème d'un fermier ayant 17 poules et 6 lapins (nombre total d'animaux) ?","choix":["Il est inférieur aux deux nombres de départ","Il dépasse 17 et 6 et répond à la question posée","Il est un nombre pair, comme les données","Il est un multiple du nombre de lapins"],"bonne":1,"explication":"23 est supérieur à 17 et à 6 et répond à « combien en tout ? ».","dur":45},{"id":"22","theme":"Méthode de Polya","enonce":"Un jardinier veut entourer un jardin rectangulaire de 8 m sur 5 m avec une clôture. Que doit-il calculer ?","choix":["L'aire du rectangle","Le périmètre du rectangle","Le volume du jardin","La diagonale du rectangle"],"bonne":1,"explication":"Entourer une figure d'une clôture revient à calculer son périmètre.","dur":30},{"id":"23","theme":"Méthode de Polya","enonce":"Quelle longueur de clôture faut-il pour entourer un jardin rectangulaire de 8 m sur 5 m ?","choix":["40 m","13 m","18 m","26 m"],"bonne":3,"explication":"2 × (8 + 5) = 26 m.","dur":30},{"id":"24","theme":"Méthode de Polya","enonce":"Pourquoi une clôture de 26 m est-elle jugée cohérente pour entourer un jardin rectangulaire de 8 m sur 5 m ?","choix":["Elle dépasse 16 m (deux côtés de 8 m) tout en restant raisonnable","Elle est inférieure à la longueur du jardin lui-même","Elle est égale à l'aire du jardin exprimée en m²","Elle est un multiple de la largeur du jardin"],"bonne":0,"explication":"26 m est supérieur à 16 m tout en restant raisonnable pour un petit jardin.","dur":30},{"id":"25","theme":"Problèmes additifs et soustractifs","enonce":"Quel chercheur en didactique a montré qu'il existe plusieurs catégories de problèmes additifs et soustractifs ?","choix":["Gérard Vergnaud","George Polya","Jean-Pierre Astolfi","Guy Brousseau"],"bonne":0,"explication":"Gérard Vergnaud a catégorisé les problèmes additifs et soustractifs.","dur":45},{"id":"26","theme":"Problèmes additifs et soustractifs","enonce":"Pour un même couple d'opérations (addition/soustraction), de quoi dépend la difficulté d'un problème ?","choix":["Uniquement de la taille des nombres utilisés","Uniquement de la longueur du texte de l'énoncé","De la place de l'inconnue et de la relation entre les quantités","Uniquement de la présence d'un dessin d'illustration"],"bonne":2,"explication":"La difficulté dépend de la place de l'inconnue et de la nature de la relation entre les quantités.","dur":30},{"id":"27","theme":"Problèmes additifs et soustractifs","enonce":"Parmi les catégories de problèmes additifs et soustractifs, laquelle présente une difficulté faible ?","choix":["La recherche d'un état initial","La comparaison (recherche de l'écart)","La composition de deux états (recherche du tout)","La recherche de la transformation"],"bonne":2,"explication":"Dans la composition, l'addition des deux parties connues est directement suggérée.","dur":30},{"id":"28","theme":"Problèmes additifs et soustractifs","enonce":"« Fatima a 5 billes rouges et 3 billes bleues. Combien a-t-elle de billes en tout ? » De quelle catégorie de problème additif s'agit-il ?","choix":["Recherche d'un état initial","Comparaison de deux états","Recherche d'une transformation","Composition de deux états"],"bonne":3,"explication":"On cherche le tout à partir de deux parties connues.","dur":45},{"id":"29","theme":"Problèmes additifs et soustractifs","enonce":"« Fatima avait des billes, elle en a gagné 4, elle en a maintenant 9. Combien en avait-elle au départ ? » De quelle catégorie de problème s'agit-il ?","choix":["Composition de deux états","Comparaison de deux états","Recherche d'un état initial","Recherche d'une transformation"],"bonne":2,"explication":"L'inconnue porte sur l'état de départ.","dur":45},{"id":"30","theme":"Problèmes additifs et soustractifs","enonce":"Pourquoi la recherche d'un état initial est-elle plus difficile qu'une composition de deux états pour l'élève ?","choix":["Les nombres utilisés sont toujours bien plus grands","L'énoncé ne contient jamais de question explicite","Il doit raisonner « à l'envers » par rapport à l'histoire","Aucune opération ne permet de la résoudre ici"],"bonne":2,"explication":"L'histoire est chronologique mais la question porte sur le tout début.","dur":45},{"id":"31","theme":"Problèmes additifs et soustractifs","enonce":"« Karim a 12 ans, sa sœur a 8 ans. Quelle est la différence d'âge entre eux ? » De quelle catégorie de problème s'agit-il ?","choix":["Composition de deux états","Recherche d'une transformation","Recherche d'un état initial","Comparaison (recherche de l'écart)"],"bonne":3,"explication":"On compare deux états pour trouver l'écart.","dur":45},{"id":"32","theme":"Problèmes additifs et soustractifs","enonce":"Pourquoi un problème de comparaison d'âges évoque-t-il peu la soustraction chez de nombreux élèves ?","choix":["Il utilise toujours des nombres décimaux","Il n'y a ni action ni transformation, seulement une comparaison","Il exige obligatoirement une multiplication","Il ne contient aucun nombre dans l'énoncé"],"bonne":1,"explication":"La comparaison est statique : sans action, la soustraction n'est pas évoquée spontanément.","dur":30},{"id":"33","theme":"Problèmes additifs et soustractifs","enonce":"« Karim avait 15 DH, il lui en reste 6 après ses achats. Combien a-t-il dépensé ? » De quelle catégorie de problème s'agit-il ?","choix":["Composition de deux états","Recherche de la transformation","Comparaison de deux états","Recherche de l'état initial"],"bonne":1,"explication":"On cherche la transformation entre deux états connus.","dur":45},{"id":"34","theme":"Problèmes additifs et soustractifs","enonce":"Dans un problème où l'on cherche ce qu'un élève a dépensé entre deux états connus, quelle erreur plication":"En partition, le diviseur est le nombre de parts ; le quotient est la taille de chaque part.","dur":30},{"id":"44","theme":"Problèmes multiplicatifs et division","enonce":"Dans une division-groupement (quotition), que représente le diviseur ?","choix":["Le nombre de parts","Le nombre de groupes obtenus","La taille de chaque groupe","Le reste de la division"],"bonne":2,"explication":"En quotition, le diviseur est la taille de chaque groupe ; le quotient est le nombre de groupes.","dur":30},{"id":"45","theme":"Problèmes multiplicatifs et division","enonce":"Lequel des deux modèles de division est souvent le plus difficile à identifier comme une division par les élèves ?","choix":["La partition (division-partage)","Les groupements égaux","La quotition (division-groupement)","La configuration rectangulaire"],"bonne":2,"explication":"La quotition est souvent plus difficile à reconnaître comme une division.","dur":45},{"id":"46","theme":"Problèmes multiplicatifs et division","enonce":"Dans quelle formulation les élèves reconnaissent-ils le plus facilement une situation de division ?","choix":["« Constituer des groupes d'une taille donnée »","« Répartir équitablement entre plusieurs personnes »","« Ajouter plusieurs quantités ensemble »","« Comparer deux nombres entre eux »"],"bonne":1,"explication":"Les élèves reconnaissent aisément la division dans les situations de partage.","dur":30},{"id":"47","theme":"Problèmes multiplicatifs et division","enonce":"Comment de nombreux élèves traitent-ils une situation de quotition, au lieu d'écrire une division ?","choix":["Par soustractions successives ou par comptage","Par une multiplication par zéro","Par une addition de fractions","Par un schéma sagittal obligatoire"],"bonne":0,"explication":"Ils recourent aux soustractions successives ou au comptage, sans mobiliser l'écriture division.","dur":30},{"id":"48","theme":"Problèmes multiplicatifs et division","enonce":"« 45 élèves sont répartis en 5 groupes égaux. Combien  des erreurs (Astolfi)","enonce":"Un élève perd le fil du calcul intermédiaire dans un problème à plusieurs étapes. À quelle catégorie d'erreur (typologie d'Astolfi) cela correspond-il ?","choix":["Une erreur liée aux opérations mentales exigées","Une erreur de compréhension des consignes","Une erreur liée au contrat didactique","Une erreur d'origine didactique"],"bonne":0,"explication":"La charge cognitive de la tâche dépasse les capacités disponibles de l'élève.","dur":45},{"id":"67","theme":"Typologie des erreurs (Astolfi)","enonce":"Un problème simple est formulé avec un vocabulaire trop complexe pour le niveau de lecture de l'élève. À quelle catégorie d'erreur (typologie d'Astolfi) cela correspond-il ?","choix":["Une conception alternative (obstacle)","Une surcharge cognitive contextuelle","Une erreur liée au contrat didactique","Une erreur d'origine didactique"],"bonne":1,"explication":"Le contexte de l'énoncé parasite la compréhension mathématique.","dur":45},{"id":"68","theme":"Typologie des erreurs (Astolfi)","enonce":"La présentation exclusive de la multiplication comme addition répétée freine la multiplication des décimaux. À quelle catégorie d'erreur (typologie d'Astolfi) cela correspond-il ?","choix":["Une erreur de compréhension des consignes","Une erreur d'origine didactique","Une surcharge cognitive contextuelle","Une erreur liée au contrat didactique"],"bonne":1,"explication":"L'erreur provient de la façon dont la notion a été enseignée.","dur":45},{"id":"69","theme":"Typologie des erreurs (Astolfi)","enonce":"Dans le diagnostic d'une erreur récurrente d'élève, que doit éviter l'enseignant ?","choix":["Chercher la catégorie d'erreur la plus probable","Examiner la procédure utilisée par l'élève","Orienter le choix de la remédiation","Se limiter à « l'élève n'a pas fait attention »"],"bonne":3,"explication":"Il faut chercher la catégorie d'erreur la plus probable plutôt que se limiter à un diagnostic superficiel.","dur":30},{"id":"70","theme":"Typologie des erreurs (Astolfi)","enonce":"À quoi sert la catégorisation d'une erreur récurrente d'élève ?","choix":["À classer les élèves par niveau","À attribuer une note à la copie","À orienter le choix de la remédiation","À supprimer l'erreur définitivement"],"bonne":2,"explication":"La catégorie la plus probable oriente directement la remédiation.","dur":30},{"id":"71","theme":"Erreurs courantes et remédiation","enonce":"Dans une soustraction posée comme 52 − 27, quelle est l'origine probable d'une erreur de « report » ?","choix":["Un problème de vue ou de lisibilité des chiffres","Une procédure mécanique sans sens de la valeur positionnelle","Un manque de matériel ou de temps dans la classe","Une fatigue passagère ou un manque de concentration"],"bonne":1,"explication":"L'élève applique mécaniquement une procédure apprise par cœur sans comprendre la valeur positionnelle.","dur":30},{"id":"72","theme":"Erreurs courantes et remédiation","enonce":"Quelle remédiation convient à une erreur de report dans une soustraction posée ?","choix":["Un retour à la manipulation avec du matériel de groupement","Une réexplication plus rapide de la technique","Une multiplication d'exercices de calcul identiques","Une suppression de la soustraction posée"],"bonne":0,"explication":"On manipule dizaines et unités avant de reposer la technique.","dur":30},{"id":"73","theme":"Erreurs courantes et remédiation","enonce":"Quelle remédiation convient à l'idée « plus on multiplie, plus le résultat est grand » appliquée aux décimaux inférieurs à 1 ?","choix":["L'interdiction des nombres décimaux en classe","La mémorisation d'une nouvelle règle de calcul","L'abandon de la multiplication des décimaux","Des situations de partage montrant que × 0,5 revient à la moitié"],"bonne":3,"explication":"Les situations de partage font apparaître que multiplier par 0,5 revient à prendre la moitié.","dur":45},{"id":"74","theme":"Erreurs courantes et remédiation","enonce":"Pourquoi certains élèves jugent-ils 3,45  des élèves calculent 84 − 6. Quelle conception cela révèle-t-il probablement ?","choix":["Une confusion entre périmètre et aire","Une vision de la situation comme un simple retrait","Une erreur de report dans une addition","Une difficulté de dénombrement des objets"],"bonne":1,"explication":"Ils voient un retrait (obstacle didactique) sans reconnaître un groupement répété.","dur":45},{"id":"97","theme":"Étude de cas","enonce":"Quelle remédiation est adaptée à des élèves qui multiplient ou soustraient dans un problème de rangement de 84 œufs en boîtes de 6 ?","choix":["Refaire un cours magistral complet sur la table de 6","Multiplier les exercices de multiplication posée en colonnes","Abandonner ce type de problème pour la suite de l'année","Manipuler des jetons par paquets de 6, verbaliser, trier des énoncés"],"bonne":3,"explication":"Manipulation, verbalisation du lien avec 84 ÷ 6, puis tri collectif d'énoncés.","dur":45},{"id":"98","theme":"Étude de cas","enonce":"Un berger répartit 84 moutons en enclos de 7 moutons chacun. De quelle catégorie de problème multiplicatif ou de division relève-t-il ?","choix":["Partition (division-partage)","Groupements égaux (multiplication)","Configuration rectangulaire (aire)","Quotition (division-groupement)"],"bonne":3,"explication":"La taille de chaque enclos est connue et on cherche le nombre d'enclos.","dur":45},{"id":"99","theme":"Étude de cas","enonce":"Un berger répartit 84 moutons en enclos de 7 moutons chacun. Combien d'enclos faut-il ?","choix":["588 enclos","77 enclos","91 enclos","12 enclos"],"bonne":3,"explication":"84 ÷ 7 = 12.","dur":30},{"id":"100","theme":"Étude de cas","enonce":"Pour 84 moutons répartis en enclos de 7, un élève répond 84 × 7 = 588. Quelle remédiation est la plus adaptée ?","choix":["Lui faire réapprendre la table de 7 par cœur à la maison","Manipuler des groupements puis trier des énoncés pour retrouver le sens","Lui faire recopier plusieurs fois la bonne solution sur son cahier","Ne rien faire car la réponse est un simple oubli de calcul"],"bonne":1,"explication":"Il faut retravailler le sens de l'opération par manipulation et tri d'énoncés.","dur":45}]}</script><script id="main">const g=i=>document.getElementById(i),app=g('app'),IT=200000;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W+/g,'_');
const norm=s=>String(s).trim().normalize('NFC').toLowerCase();
const pw=(t,c,i)=>[t,c,i].map(norm).join('&'); /* mot de passe : test&classe&identifiant */

/* ---------- Chiffrement (Web Crypto) ---------- */
const b64=u=>{let s='';for(const b of u)s+=String.fromCharCode(b);return btoa(s)},unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const dkey=async(p,salt)=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
async function seal(d){
 if(!(window.crypto&&crypto.subtle))throw Error('Chiffrement indisponible : ouvrez ce fichier depuis votre ordinateur ou en https.');
 const e=d.etudiant,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),
 ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await dkey(pw(d.testId,e.classe,e.identifiant),salt),new TextEncoder().encode(JSON.stringify(d)));
 return{format:'qcm-reponses-chiffrees',version:2,testUid:d.testUid,testId:d.testId,classe:e.classe,identifiant:e.identifiant,kdf:'PBKDF2-SHA256',iterations:IT,salt:b64(salt),iv:b64(iv),donnees:b64(new Uint8Array(ct))}}
async function unseal(e){
 if(!(window.crypto&&crypto.subtle))throw Error('Chiffrement indisponible dans ce navigateur');
 try{if(e.iterations!=IT)throw 0;
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(e.iv)},await dkey(pw(e.testId,e.classe,e.identifiant),unb(e.salt)),unb(e.donnees)),d=JSON.parse(new TextDecoder().decode(p));
  if(norm(d.testId)!=norm(e.testId)||norm(d.etudiant.classe)!=norm(e.classe)||norm(d.etudiant.identifiant)!=norm(e.identifiant))throw 0;return d
 }catch(_){throw Error('mot de passe incorrect ou fichier modifié')}}

const pts=(cf,ce,a)=>!a.repondu?0:ce?(a.certitude?(a.correct?1:-1)*cf*a.certitude:0):(a.correct?cf:0);
const r2=x=>Math.round(x*100)/100;
/* ---------- Test étudiant : tentatives, départs, blocage, reprise ---------- */
const JRS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const suffJ=d=>{const n=JRS[d.getDay()],p=x=>String(x).padStart(2,'0'),y=String(d.getFullYear());return n[0]+p(d.getDate())+n[1]+p(d.getMonth()+1)+n[2]+y.slice(0,2)+n[3]+y.slice(2)+n.slice(4)};
const mdpJour=(c,i,d)=>norm(c)+norm(i)+suffJ(d);
function student(c){
 const o=c.options,N=Math.min(c.nbQuestions,c.banque.length),KI='qcm-etudiant',AT=c.att||{},TM=AT.max||3,DM=AT.departs||2,HB=AT.heures||24,RP=AT.reprise!==false,EX=AT.extra==null?1:AT.extra;
 let I={},Q=[],A=[],cur=0,run=false,D0=new Date(),tm=0,cd=0,left=0,ech=0,tdl=0,tmo=false,msg='',st={};
 try{I=JSON.parse(localStorage.getItem(KI))||{}}catch(_){}
 const key=()=>'qcm-tentatives:'+c.testUid+':'+norm(I.classe)+':'+norm(I.identifiant);
 const ld=()=>{let s=null;try{s=JSON.parse(localStorage.getItem(key()))}catch(_){}const o2=Object.assign({n:0,x:0,d:0,en:false,bl:0,t:0,rp:0,es:0,mb:0,h:[],r:[],p:null},s||{});o2.a=TM+(o2.x||0);if(o2.p&&o2.pv!==c.pub)o2.p=null;return o2};
 const tn=()=>Math.max(Date.now(),st.t||0),iso=()=>new Date(tn()).toISOString();
 const sv=()=>{st.t=tn();try{localStorage.setItem(key(),JSON.stringify(st))}catch(_){}};
 const stop=()=>{run=false;clearInterval(tm)};
 const dep=why=>{st.d++;st.en=false;st.h.push({fin:iso(),issue:why||'départ'});if(st.d>=DM)st.bl=tn()+HB*36e5;sv()};
 const showTot=()=>{const e=g('tot');if(e&&tdl){const s=Math.max(0,Math.ceil((tdl-tn())/1000));e.textContent='⏳ Total '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}};
 function endAll(){tmo=true;stop();while(A.length<Q.length)push(Q[A.length],-1,null);finish()}
 const showT=()=>{const e=g('chr');if(e)e.textContent='⏱ '+left+' s'};
 const push=(q,j,ct)=>A.push({ordre:A.length+1,questionId:q.id,theme:q.theme,enonce:q.q,choixAffiches:q.ch,reponse:j<0?'(sans réponse)':q.ch[j],repondu:j>=0,bonneReponse:q.ch[q.ok],correct:j==q.ok,certitude:c.cert&&j>=0&&ct?+ct:null,dureeAllouee:q.dur,horodatage:new Date().toISOString()});
 const down=async res=>{try{dl('reponses_'+clean(I.classe)+'_'+clean(c.testId)+'_'+clean(I.identifiant)+'_t'+res.tentative+'.json',JSON.stringify(await seal(res),null,1),'application/json');g('er').textContent=''}catch(e){g('er').textContent=e.message}};
 const chg='<button class=g id=chg style="margin-top:14px">Ce n\'est pas moi : changer d\'élève</button>';
 const bindChg=()=>{const b=g('chg');if(b)b.onclick=()=>{clearInterval(cd);I={};try{localStorage.removeItem(KI)}catch(_){}intro()}};
 const rep=()=>RP?'<div class=warn style="margin-top:14px"><b>Reprise autorisée par l\'enseignant</b><label>Mot de passe du jour<input id=mdp autocomplete=off></label><p class=ko id=mer role=alert></p><button id=rpb>Reprendre</button></div>':'';
 const bindRep=()=>{const b=g('rpb');if(!b)return;b.onclick=()=>{
  if(tn()<st.mb)return g('mer').textContent='Trop d’essais : réessayez dans '+Math.ceil((st.mb-tn())/6e4)+' min.';
  if(norm(g('mdp').value)!==mdpJour(I.classe,I.identifiant,new Date(tn()))){st.es++;if(st.es>=5){st.mb=tn()+3e5;st.es=0;sv();return g('mer').textContent='5 essais ratés : saisie bloquée pendant 5 minutes.'}sv();return g('mer').textContent='Mot de passe incorrect.'}
  clearInterval(cd);st.bl=0;st.d=0;st.x=(st.x||0)+EX;st.a=TM+st.x;st.rp++;st.es=0;st.h.push({debut:iso(),issue:'reprise'});sv();
  app.innerHTML=`<div class=card><p class=ok>Reprise autorisée. Il vous reste ${st.a-st.n} tentative(s).</p>${st.p?'<button id=go2>Continuer le test</button>':st.a>st.n?'<button id=go2>Commencer</button>':''}</div>`;if(g('go2'))g('go2').onclick=st.p?resume:start}};
 const leave=()=>{if(!run||!o.ac)return;back();stop();persist();dep();if(st.bl>tn())return blocked();
  pause(`Vous avez quitté la page : cela compte comme un départ (${st.d} sur ${DM}). Au prochain départ, le test sera bloqué ${HB} h.`)};
 /* tolérance : une perte de focus courte (notification) n'est pas comptée ; changer d'onglet, d'application ou quitter la page compte tout de suite */
 const GR=Math.max(0,AT.grace==null?0:+AT.grace||0)*1000;let pend=0;
 const back=()=>{if(pend){clearTimeout(pend);pend=0}};
 const soft=()=>{if(!run||!o.ac)return;if(!GR||document.hidden)return leave();if(!pend)pend=setTimeout(()=>{pend=0;if(run&&(!document.hasFocus()||document.hidden))leave()},GR)};
 if(o.ac){document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
  ['pagehide','freeze'].forEach(e=>{addEventListener(e,leave);document.addEventListener(e,leave)});
  addEventListener('blur',soft);addEventListener('focus',back);
  setInterval(()=>{if(document.hasFocus())back();else soft()},400)}
 const after=()=>st.p?pause(''):st.n>=st.a?maxed():intro();
 const persist=()=>{st.p={Q,A,cur,dl:ech,tdl,debut:D0.toISOString()};sv()};
 const reshuf=q=>{if(!o.mix)return;const h=shuf(q.ch.map((x,i)=>({x,ok:i==q.ok})));q.ch=h.map(z=>z.x);q.ok=h.findIndex(z=>z.ok)};
 function pause(m){stop();clearInterval(cd);const p=st.p;
  app.innerHTML=`<div class=card><h1>${esc(c.titre)}</h1>${m?`<p class=ko role=alert>${m}</p>`:''}<p class=m>Test en cours : question ${p.cur+1} sur ${p.Q.length} · tentative ${st.n}/${st.a} · départs ${st.d}/${DM}.</p>${p.dl?'<p class=m>Le chronomètre de la question continue de tourner pendant votre absence.</p>':''}${p.tdl?'<p class=m>Le chronomètre total du test continue de tourner pendant votre absence.</p>':''}<button id=go3>Continuer le test</button></div>`;
  g('go3').onclick=resume}
 function resume(){const p=st.p;if(!p)return intro();
  if(st.bl>tn())return blocked();if(st.bl){st.bl=0;st.d=0;sv()}
  Q=p.Q;A=p.A;cur=p.cur;ech=p.dl||0;tdl=p.tdl||0;D0=new Date(p.debut);run=true;st.en=true;
  if(tdl&&tn()>=tdl)return endAll();
  if(ech&&tn()>=ech){push(Q[cur],-1,null);cur++;if(cur>=Q.length)return finish();ech=0;Q.slice(cur).forEach(reshuf);return ask()}
  Q.slice(cur).forEach(reshuf);ask(!!ech)}
 function begin(){if(st.en){if(o.ac)dep('fermeture');else{st.en=false;sv()}}
  if(st.bl>tn())return blocked();if(st.bl){st.bl=0;st.d=0;sv()}
  if(st.p)return pause('');after2()}
 function after2(){if(st.n>=st.a)return maxed();start()}
 function blocked(){stop();clearInterval(cd);
  app.innerHTML=`<div class=card><h1>${esc(c.titre)}</h1><p class=ko role=alert>Test bloqué après plusieurs départs de la page. Vous pourrez continuer dans <b id=cdt></b></p>${st.p?'<p class=m>Votre test en cours est conservé : vous le reprendrez là où vous vous êtes arrêté.</p>':''}${rep()}${chg}</div>`;
  const tick=()=>{const e=g('cdt');if(!e)return clearInterval(cd);const l=st.bl-tn();if(l<=0){clearInterval(cd);st.bl=0;st.d=0;sv();return after()}const s=Math.ceil(l/1e3);e.textContent=[s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':');sv()};
  tick();cd=setInterval(tick,1000);bindRep();bindChg()}
 function maxed(){stop();clearInterval(cd);
  app.innerHTML=`<div class=card><h1>${esc(c.titre)}</h1>${msg?`<p class=ko role=alert>${msg}</p>`:''}<p class=ko role=alert>Nombre maximal de tentatives atteint (${st.n} sur ${st.a}).</p>${st.r.length?'<p class=m>Réponses déjà terminées :</p>'+st.r.map((x,i)=>`<button class=g data-dl=${i}>Télécharger la tentative ${x.tentative}</button>`).join(' '):''}<p class=ko id=er role=alert></p>${rep()}${chg}</div>`;msg='';
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>down(st.r[+b.dataset.dl]));bindRep();bindChg()}
 function intro(){stop();clearInterval(cd);
  const v=x=>esc(I[x]||''),cl=c.classes.length?`<select id=cl>${c.classes.map(x=>`<option${x==I.classe?' selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id=cl value="${v('classe')}">`;
  app.innerHTML=`<div class=card><h1>${esc(c.titre)}</h1>${msg?`<p class=ko role=alert>${msg}</p>`:''}${o.ac?`<p class=warn>Ne quittez pas cette fenêtre pendant le test : changer d\'onglet ou d\'application compte comme un départ et le chronomètre de la question continue de tourner. ${GR?`Une courte interruption de moins de ${GR/1000} s (une notification, par exemple) n\'est pas comptée. `:'Une notification qui interrompt la fenêtre compte aussi comme un départ : désactivez-les avant de commencer. '}Après ${DM} départ(s), le test est bloqué pendant ${HB} h. Au retour, vous reprenez là où vous vous êtes arrêté et l\'ordre des choix est de nouveau mélangé. Vous disposez de ${TM} tentative(s).</p>`:''}<p class=m>${N} question(s) tirée(s) au hasard${c.dur?', '+c.dur+' s par question (durée variable pour certaines)':''}${c.tot?' · durée totale : '+c.tot+' min':''}${c.cert?'. Pour chaque question : un choix et un degré de certitude de 1 à 4':''}.</p>
<label>Classe${cl}</label><label>Identifiant (N°, Code Apogée ou CNE)<input id=idf value="${v('identifiant')}"></label><label>Nom et prénom<input id=nm value="${v('nom')}" autocomplete=name></label>${o.dnd&&o.ac?'<label class=ck><input type=checkbox id=dnd> Je confirme avoir désactivé mes notifications (mode « Ne pas déranger » ou mode avion)</label>':''}<p class=ko id=er role=alert></p><button id=go>Commencer</button></div>`;msg='';
  g('go').onclick=()=>{
   const t=i=>g(i).value.trim();
   if(!t('cl')||!t('idf')||!t('nm'))return g('er').textContent='Tous les champs sont obligatoires.';
   if(o.dnd&&o.ac&&!g('dnd').checked)return g('er').textContent='Confirmez que vos notifications sont désactivées avant de commencer.';
   I={classe:t('cl'),identifiant:t('idf'),nom:t('nm')};try{localStorage.setItem(KI,JSON.stringify(I))}catch(_){}
   st=ld();begin()}}
 function start(){clearInterval(cd);st.n++;st.en=true;st.pv=c.pub;st.h.push({debut:iso()});sv();
  Q=shuf(c.banque.slice()).slice(0,N).map(q=>{let h=q.choix.map((x,i)=>({x,ok:i==q.bonne}));if(o.mix)h=shuf(h);return{id:q.id,theme:q.theme,q:q.enonce,ch:h.map(z=>z.x),ok:h.findIndex(z=>z.ok),dur:q.dur>0?q.dur:c.dur}});
  A=[];cur=0;D0=new Date();tdl=c.tot>0?tn()+c.tot*6e4:0;tmo=false;run=true;ask()}
 function ask(keep){
  const q=Q[cur];clearInterval(tm);if(!keep)ech=q.dur?tn()+q.dur*1000:0;persist();left=ech?Math.max(0,Math.ceil((ech-tn())/1000)):0;
  app.innerHTML=`<div class=card><p class=m>Question ${cur+1} sur ${Q.length} · tentative ${st.n}/${st.a}<b id=chr style="float:right;font-size:20px"></b><b id=tot style="float:right;font-size:16px;margin-right:16px"></b></p><div class=bar><i style="width:${100*cur/Q.length}%"></i></div><h2>${esc(q.q)}</h2>${q.ch.map((x,j)=>`<label class=op><input type=radio name=r value=${j}>${esc(x)}</label>`).join('')}
${c.cert?`<h3>Degré de certitude</h3><div class=g4>${[1,2,3,4].map(k=>`<label class=op><input type=radio name=ct value=${k}>${k}</label>`).join('')}</div><p class=m>1 : très incertain, 4 : très certain</p>`:''}<p class=ko id=er role=alert></p><button id=ok>Valider ma réponse</button></div>`;
  if(ech||tdl){const tk=()=>{sv();const n=tn();if(tdl&&n>=tdl)return endAll();if(ech){left=Math.max(0,Math.ceil((ech-n)/1000));showT()}showTot();if(ech&&ech-n<=0)submit(true)};tk();tm=setInterval(tk,1000)}
  g('ok').onclick=()=>submit(false)}
 function submit(auto){
  const q=Q[cur],r=app.querySelector('input[name=r]:checked'),ct=app.querySelector('input[name=ct]:checked');
  if(!auto){if(!r)return g('er').textContent='Choisissez une réponse.';if(c.cert&&!ct)return g('er').textContent='Indiquez votre degré de certitude.'}
  clearInterval(tm);push(q,r?+r.value:-1,ct&&ct.value);cur++;cur<Q.length?ask():finish()}
 function finish(){stop();const D1=new Date();st.en=false;st.p=null;st.h.push({fin:iso(),issue:'terminée'});
  const sc=r2(A.reduce((s,a)=>s+pts(c.coef,c.cert,a),0)),
